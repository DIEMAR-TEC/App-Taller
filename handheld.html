<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14243a">
<title>Handheld | Titán Flota</title>
<!--
  La pantalla de la terminal con lector (handheld) del depósito y la gomería.

  Tres cosas, las que se hacen parado frente al estante o al camión:
    - Baja de repuestos: se fija la patente que recibe y cada QR que se
      escanea es una salida de una unidad, sin más pasos.
    - Movimiento de stock: entrada, salida o ajuste con cantidad.
    - Gomería: la unidad, sus posiciones, retirar y montar cubiertas.

  El código entra de tres maneras y las tres terminan en la misma función
  (escaneado):
    1. El lector de la terminal en modo teclado: escribe el código en el
       campo enfocado y manda Enter.
    2. El lector por aviso del sistema (broadcast): la app Android lo
       recibe y llama a window.alEscanear(texto).
    3. La cámara, con BarcodeDetector si el navegador lo trae o jsQR si no.

  No tiene API propia: usa las mismas que Repuestos y Gomería, con los
  mismos permisos. La APK de android/ abre esta dirección.
-->
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--plane,#f2f5f8);color:var(--ink,#121212);
  font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px}
header.hh{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;
  padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));
  background:#14243a;color:#fff}
header.hh button.volver{border:0;background:#ffffff1f;color:#fff;border-radius:8px;
  padding:8px 12px;font:inherit;font-size:14px;font-weight:700}
header.hh .titulo{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
header.hh .quien{font-size:12px;opacity:.8;max-width:34vw;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
header.hh a{color:#fff;opacity:.8;font-size:12px;text-decoration:none}
main{max-width:560px;margin:0 auto;padding:12px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.vista{display:none}.vista.on{display:block}
.tiles{display:grid;gap:12px;margin-top:6px}
.tile{display:flex;align-items:center;gap:14px;width:100%;padding:20px 16px;text-align:left;
  border:1px solid var(--hairline,rgba(0,0,0,.1));border-radius:12px;background:var(--surface-1,#fff);
  color:inherit;font:inherit;cursor:pointer}
.tile:active{background:var(--surface-2,#e9eef4)}
.tile .ic{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;
  background:var(--brand,#2563eb);color:#fff;font-size:24px;font-weight:800}
.tile b{display:block;font-size:18px}
.tile span{color:var(--ink-muted,#666);font-size:13px}
label{display:block;margin:12px 0 5px;font-size:12px;font-weight:800;letter-spacing:.6px;
  text-transform:uppercase;color:var(--ink-muted,#666)}
input,select,textarea{width:100%;padding:13px 12px;font:inherit;font-size:17px;
  border:1px solid var(--hairline-2,rgba(0,0,0,.2));border-radius:10px;
  background:var(--surface-1,#fff);color:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid #2563eb;outline-offset:0}
.fila{display:flex;gap:8px;align-items:stretch}
.fila>*{flex:1;min-width:0}
.fila>.chico{flex:none}
.escaner{display:flex;gap:8px;margin-top:6px}
.escaner input{flex:1;font-size:19px;font-weight:700;letter-spacing:.5px;border-width:2px;border-color:#2563eb}
.btn{display:block;width:100%;margin-top:14px;padding:15px 14px;font:inherit;font-size:17px;font-weight:800;
  border:1px solid transparent;border-radius:10px;background:var(--brand,#2563eb);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.alt{background:var(--surface-1,#fff);color:inherit;border-color:var(--hairline-2,rgba(0,0,0,.2))}
.btn.peligro{background:#bd3038}
.btn.chico{width:auto;margin:0;padding:0 14px;font-size:15px}
.seg{display:flex;gap:6px;margin-top:4px}
.seg button{flex:1;padding:12px 6px;font:inherit;font-weight:800;border-radius:10px;cursor:pointer;
  border:1px solid var(--hairline-2,rgba(0,0,0,.2));background:var(--surface-1,#fff);color:inherit}
.seg button.on{background:#14243a;color:#fff;border-color:#14243a}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px;font-weight:600;
  text-transform:none;letter-spacing:0;color:inherit}
.check input{width:22px;height:22px}
.estado{margin-top:12px;padding:14px;border-radius:10px;font-size:16px;line-height:1.4;
  border:1px solid var(--hairline,rgba(0,0,0,.1));background:var(--surface-1,#fff)}
.estado.bien{border-color:#16834a;background:#16834a14;color:#0f5c34}
.estado.mal{border-color:#bd3038;background:#bd303814;color:#8e1f26}
.estado.aviso{border-color:#c98a04;background:#f0b42918;color:#7a5200}
.estado b{display:block;font-size:18px}
.ficha{margin-top:12px;padding:14px;border-radius:10px;background:var(--surface-1,#fff);
  border:1px solid var(--hairline,rgba(0,0,0,.1))}
.ficha .cod{font-size:20px;font-weight:800}
.ficha .desc{margin-top:2px}
.ficha .stock{margin-top:6px;font-size:14px;color:var(--ink-muted,#666)}
h2{margin:18px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-muted,#666)}
ul.lista{list-style:none;margin:0;padding:0}
ul.lista li{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:6px;border-radius:10px;
  background:var(--surface-1,#fff);border:1px solid var(--hairline,rgba(0,0,0,.1))}
ul.lista li .txt{flex:1;min-width:0}
ul.lista li .txt b{display:block}
ul.lista li .txt span{font-size:13px;color:var(--ink-muted,#666)}
ul.lista li.anulado{opacity:.5;text-decoration:line-through}
ul.lista li button{padding:9px 11px;font:inherit;font-size:13px;font-weight:700;border-radius:8px;
  border:1px solid var(--hairline-2,rgba(0,0,0,.2));background:var(--surface-1,#fff);color:inherit}
.unidad{margin-top:12px;font-size:20px;font-weight:800}
.unidad span{display:block;font-size:13px;font-weight:400;color:var(--ink-muted,#666)}
.posiciones{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.pos{padding:12px;border-radius:10px;text-align:left;font:inherit;cursor:pointer;color:inherit;
  border:1px solid var(--hairline-2,rgba(0,0,0,.2));background:var(--surface-1,#fff)}
.pos.vacia{border-style:dashed;background:transparent;color:var(--ink-muted,#666)}
.pos.on{outline:3px solid #2563eb}
.pos small{display:block;font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--ink-muted,#666)}
.pos b{display:block;font-size:16px;margin-top:2px}
.pos span{font-size:12px;color:var(--ink-muted,#666)}
.hoja{margin-top:12px;padding:14px;border-radius:12px;background:var(--surface-1,#fff);
  border:2px solid #2563eb}
.camara{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.camara video{flex:1;width:100%;object-fit:cover;min-height:0}
.camara .marco{position:absolute;left:50%;top:42%;width:64vw;height:64vw;max-width:340px;max-height:340px;
  transform:translate(-50%,-50%);border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 999px #0007}
.camara .pie{padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:#000}
textarea{min-height:130px;resize:vertical;font-size:16px}
.dictar{display:flex;gap:8px;margin-top:10px}
.dictar .btn{margin-top:0}
.btn.grabando{background:#bd3038;animation:late 1s infinite}
@keyframes late{50%{opacity:.6}}
.propuesta{margin-top:12px;padding:14px;border-radius:10px;border:2px solid #2563eb;background:var(--surface-1,#fff)}
.propuesta ul{margin:8px 0 0;padding-left:20px}
.propuesta li{margin:4px 0}
.ayuda{font-size:13px;color:var(--ink-muted,#666);margin:6px 0 0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.kpi{padding:12px;border-radius:10px;background:var(--surface-1,#fff);border:1px solid var(--hairline,rgba(0,0,0,.1))}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-muted,#666)}
.acciones{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.acciones .btn{margin:0;font-size:15px;padding:14px 8px;text-align:center;text-decoration:none}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface-1,#fff);border-radius:10px;overflow:hidden}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-muted,#666);padding:8px}
table.t td{padding:8px;border-top:1px solid var(--hairline,rgba(0,0,0,.08));vertical-align:top}
table.t .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase;background:#e9eef4}
.chip.mal{background:#bd303820;color:#8e1f26}.chip.aviso{background:#f0b42930;color:#7a5200}.chip.bien{background:#16834a20;color:#0f5c34}
.flash{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .35s}
.flash.bien{background:#16834a;opacity:.35}
.flash.mal{background:#bd3038;opacity:.45}
</style>

<body>

<header class="hh">
  <button class="volver" id="volver" hidden>‹ Inicio</button>
  <span class="titulo" id="titulo">Titán Flota · Handheld</span>
  <span class="quien" id="quien"></span>
  <a href="/salir">Salir</a>
</header>
<div class="flash" id="flash"></div>

<main>

<!-- -------------------------------------------------------------- inicio -->
<section class="vista on" id="v-inicio" data-titulo="Titán Flota · Handheld">
  <div class="escaner">
    <input id="i-scan" class="scan" autocomplete="off" autocapitalize="characters" inputmode="none" placeholder="Escanear un código">
    <button class="btn chico alt" data-camara="i-scan">Cámara</button>
  </div>
  <div id="i-estado"></div>
  <div class="tiles">
    <button class="tile" data-ir="v-baja">
      <span class="ic">−</span>
      <span><b>Baja de repuestos</b><span>Cada QR escaneado descuenta una unidad del stock.</span></span>
    </button>
    <button class="tile" data-ir="v-stock">
      <span class="ic">±</span>
      <span><b>Movimiento de stock</b><span>Entrada, salida o ajuste con cantidad.</span></span>
    </button>
    <button class="tile" data-ir="v-gomeria">
      <span class="ic">◎</span>
      <span><b>Gomería</b><span>Retirar y montar cubiertas por posición.</span></span>
    </button>
    <button class="tile" data-ir="v-unidad">
      <span class="ic">▤</span>
      <span><b>Ficha de la unidad</b><span>Historia, km, litros, cubiertas y órdenes.</span></span>
    </button>
    <button class="tile" data-ir="v-trabajo">
      <span class="ic">✎</span>
      <span><b>Registrar trabajo de gomería</b><span>Escrito o dictado; el sistema lo interpreta y se confirma.</span></span>
    </button>
  </div>
  <button class="btn alt" id="servidor" hidden>Dirección del servidor</button>
  <a class="btn alt" href="/handheld/qr" style="text-align:center;text-decoration:none">QR para imprimir</a>
</section>

<!-- ------------------------------------------------------ baja de repuestos -->
<section class="vista" id="v-baja" data-titulo="Baja de repuestos">
  <label for="b-patente">Patente de destino</label>
  <input id="b-patente" autocomplete="off" autocapitalize="characters" placeholder="AD247MQ">
  <label class="check"><input type="checkbox" id="b-confirmar"> Confirmar cada baja</label>

  <label for="b-scan">Código del repuesto</label>
  <div class="escaner">
    <input id="b-scan" class="scan" autocomplete="off" autocapitalize="characters" inputmode="none" placeholder="Escanear">
    <button class="btn chico alt" data-camara="b-scan" title="Cámara">Cámara</button>
    <button class="btn chico alt" data-teclado="b-scan" title="Teclado">⌨</button>
  </div>
  <div id="b-estado"></div>
  <div id="b-confirma" hidden></div>

  <h2>Bajas registradas <span id="b-cuenta"></span></h2>
  <ul class="lista" id="b-lista"></ul>
</section>

<!-- ---------------------------------------------------- movimiento de stock -->
<section class="vista" id="v-stock" data-titulo="Movimiento de stock">
  <div class="seg" id="s-tipo">
    <button data-tipo="Entrada" class="on">Entrada</button>
    <button data-tipo="Salida">Salida</button>
    <button data-tipo="Ajuste">Ajuste</button>
  </div>
  <label for="s-scan">Código del repuesto</label>
  <div class="escaner">
    <input id="s-scan" class="scan" autocomplete="off" autocapitalize="characters" inputmode="none" placeholder="Escanear">
    <button class="btn chico alt" data-camara="s-scan">Cámara</button>
    <button class="btn chico alt" data-teclado="s-scan">⌨</button>
  </div>
  <div id="s-ficha"></div>
  <div class="fila">
    <div><label for="s-cantidad">Cantidad</label>
      <input id="s-cantidad" type="number" inputmode="numeric" value="1"></div>
    <div id="s-costo-caja"><label for="s-costo">Costo unitario</label>
      <input id="s-costo" type="number" inputmode="decimal" step="0.01" placeholder="Opcional"></div>
  </div>
  <div id="s-patente-caja" hidden>
    <label for="s-patente">Patente de destino</label>
    <input id="s-patente" autocomplete="off" autocapitalize="characters" placeholder="AD247MQ">
  </div>
  <label for="s-obs">Observaciones</label>
  <input id="s-obs" autocomplete="off" placeholder="Opcional">
  <button class="btn" id="s-guardar" disabled>Registrar</button>
  <div id="s-estado"></div>
  <p style="font-size:13px;color:var(--ink-muted,#666)">En un ajuste, la cantidad negativa resta.</p>
</section>

<!-- ------------------------------------------- historia clínica de la unidad -->
<section class="vista" id="v-unidad" data-titulo="Unidad">
  <label for="u-scan">Unidad (patente, interno o QR)</label>
  <div class="escaner">
    <input id="u-scan" class="scan" autocomplete="off" autocapitalize="characters" inputmode="none" placeholder="Escanear">
    <button class="btn chico alt" data-camara="u-scan">Cámara</button>
    <button class="btn chico alt" data-teclado="u-scan">⌨</button>
  </div>
  <div id="u-estado"></div>
  <div id="u-ficha"></div>
</section>

<!-- ------------------------------------------------- registrar trabajo -->
<section class="vista" id="v-trabajo" data-titulo="Registrar trabajo">
  <label for="t-scan">Unidad (patente, interno o QR)</label>
  <div class="escaner">
    <input id="t-scan" class="scan" autocomplete="off" autocapitalize="characters" inputmode="none" placeholder="Opcional si figura en el texto">
    <button class="btn chico alt" data-camara="t-scan">Cámara</button>
    <button class="btn chico alt" data-teclado="t-scan">⌨</button>
  </div>
  <label for="t-texto">Trabajo realizado</label>
  <textarea id="t-texto" placeholder="3 eje lado izquierdo entran 2 Michelin 079 y 327 recapadas. Salen 2 Fate 380 y 381 para recapar."></textarea>
  <div class="dictar">
    <button class="btn alt" id="t-dictar" hidden>🎤 Dictar</button>
    <button class="btn" id="t-interpretar">Interpretar</button>
  </div>
  <p class="ayuda">Qué entra y qué sale, en qué eje y lado, con el número de fuego. Al terminar de dictar se interpreta solo; nada se guarda sin confirmar.</p>
  <div id="t-salida"></div>
</section>

<!-- ------------------------------------------------------------- gomería -->
<section class="vista" id="v-gomeria" data-titulo="Gomería">
  <label for="g-scan">Unidad (patente, interno o QR)</label>
  <div class="escaner">
    <input id="g-scan" class="scan" autocomplete="off" autocapitalize="characters" inputmode="none" placeholder="Escanear">
    <button class="btn chico alt" data-camara="g-scan">Cámara</button>
    <button class="btn chico alt" data-teclado="g-scan">⌨</button>
  </div>
  <div id="g-estado"></div>
  <div id="g-unidad"></div>
  <div class="posiciones" id="g-posiciones"></div>
  <div class="hoja" id="g-hoja" hidden></div>
</section>

</main>

<div class="camara" id="camara" hidden>
  <video id="cam-video" playsinline muted></video>
  <div class="marco"></div>
  <div class="pie"><button class="btn alt" id="cam-cerrar">Cerrar cámara</button></div>
</div>

<script>
/* Si el navegador del equipo es demasiado viejo para el código de abajo,
   se avisa con su versión en vez de quedar una pantalla que no responde.
   Este bloque está escrito a propósito sin sintaxis moderna. */
window.addEventListener('load', function () {
  setTimeout(function () {
    if (window.__hhListo) return;
    var m = navigator.userAgent.match(/Chrome\/([0-9.]+)/);
    var caja = document.createElement('div');
    caja.className = 'estado mal';
    caja.innerHTML = '<b>Navegador del sistema desactualizado</b>' +
      'Versión: ' + (m ? 'Chrome ' + m[1] : navigator.userAgent) +
      '. Actualizar «Android System WebView».';
    document.querySelector('main').insertBefore(caja, document.querySelector('main').firstChild);
  }, 400);
});
</script>
<script src="/vendor/jsQR.js" defer></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const patente = t => String(t || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const hora = () => new Date().toLocaleTimeString('es-AR', {hour: '2-digit', minute: '2-digit', hour12: false});

let YO = {};
let ARTS = [];          // artículos de repuestos
let STOCK = {};         // codigo -> saldo
let PUEDE_GESTIONAR = false;

/* --------------------------------------------------------------- navegación */
let VISTA = 'v-inicio';
function ir(id, empujar = true) {
  VISTA = id;
  document.querySelectorAll('.vista').forEach(v => v.classList.toggle('on', v.id === id));
  const v = document.getElementById(id);
  $('#titulo').textContent = v.dataset.titulo;
  $('#volver').hidden = id === 'v-inicio';
  if (empujar && location.hash.slice(1) !== id) history.pushState({v: id}, '', '#' + id);
  if (id === 'v-baja' || id === 'v-stock') cargarRepuestos();
  enfocar();
}
document.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => ir(b.dataset.ir));
$('#volver').onclick = () => ir('v-inicio');
window.addEventListener('popstate', () => ir(location.hash.slice(1) || 'v-inicio', false));

/* El campo de escaneo de la vista queda siempre enfocado, salvo que se esté
   escribiendo en otro: el lector en modo teclado escribe donde está el foco. */
function enfocar() {
  const campo = document.querySelector('.vista.on .scan');
  const activo = document.activeElement;
  if (!campo) return;
  if (activo && activo !== campo && /INPUT|SELECT|TEXTAREA/.test(activo.tagName)) return;
  campo.focus({preventScroll: true});
}
document.addEventListener('click', e => {
  if (!e.target.closest('input,select,textarea,button')) setTimeout(enfocar, 0);
});

/* ---------------------------------------------------------------------- API */
async function api(url, cuerpo) {
  const r = await fetch(url, cuerpo
    ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(cuerpo)}
    : {cache: 'no-store'});
  const d = await r.json().catch(() => ({error: 'Respuesta ilegible del servidor.'}));
  if (r.status === 401) { location.reload(); throw new Error('Sesión cerrada.'); }
  if (!r.ok) throw new Error(d.error || 'No se pudo completar la operación.');
  return d;
}

/* ------------------------------------------------------- sonido y vibración */
let AUDIO;
function pitido(ok) {
  try {
    AUDIO = AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const o = AUDIO.createOscillator(), g = AUDIO.createGain();
    o.frequency.value = ok ? 1500 : 220;
    o.type = ok ? 'sine' : 'square';
    g.gain.value = .15;
    o.connect(g); g.connect(AUDIO.destination);
    o.start(); o.stop(AUDIO.currentTime + (ok ? .12 : .45));
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(ok ? 60 : [200, 80, 200]); } catch (e) {}
  const f = $('#flash');
  f.className = 'flash ' + (ok ? 'bien' : 'mal');
  setTimeout(() => f.className = 'flash', 250);
}
function estado(donde, tipo, titulo, detalle = '') {
  $(donde).innerHTML = `<div class="estado ${tipo}"><b>${esc(titulo)}</b>${esc(detalle)}</div>`;
}

/* ------------------------------------------------------ lectura de códigos */
/* Lo que trae un QR puede ser la dirección completa o solo el código. */
function leerCodigo(texto) {
  const t = String(texto || '').trim();
  const rep = t.match(/\/repuestos\/([^/?#]+)/);
  if (rep) return {tipo: 'repuesto', valor: decodeURIComponent(rep[1])};
  if (/#v-trabajo\b|\/gomeria#register\b/.test(t)) return {tipo: 'trabajo', valor: ''};
  const uni = t.match(/\/u\/([^/?#]+)/);  // /gomeria/u/PAT y /handheld/u/PAT
  if (uni) return {tipo: 'unidad', valor: patente(decodeURIComponent(uni[1]))};
  return {tipo: 'texto', valor: t};
}

function articulo(codigo) {
  const c = String(codigo).trim().toUpperCase();
  return ARTS.find(a => String(a.codigo).toUpperCase() === c)
      || ARTS.find(a => a.interno && String(a.interno).toUpperCase() === c);
}

/* Todas las entradas de códigos terminan acá. */
function escaneado(texto, campoId) {
  const activo = document.activeElement;
  const id = campoId
    || (activo && activo.classList && activo.classList.contains('scan') ? activo.id : null)
    || (document.querySelector('#g-hoja:not([hidden]) .scan') && VISTA === 'v-gomeria' ? 'g-fuego' : null)
    || (document.querySelector('.vista.on .scan') || {}).id;
  if (!id || !String(texto || '').trim()) return;
  const leido = leerCodigo(texto);
  if (id === 'b-scan') return bajaEscaneada(leido);
  if (id === 's-scan') return stockEscaneado(leido);
  if (id === 'g-scan') return gomeriaEscaneada(leido);
  if (id === 'g-fuego') return montarEscaneada(leido);
  if (id === 't-scan') return trabajoEscaneado(leido);
  if (id === 'i-scan') return inicioEscaneado(leido);
  if (id === 'u-scan') return unidadEscaneada(leido);
}

/* Desde el inicio, el código decide a dónde ir: el QR de un repuesto va a
   la baja, el de una unidad o el de «registrar trabajo» al parte. */
async function inicioEscaneado(leido) {
  if (leido.tipo === 'trabajo') { pitido(true); return ir('v-trabajo'); }
  if (leido.tipo === 'unidad') { ir('v-unidad'); return cargarFicha(leido.valor); }
  if (leido.tipo === 'repuesto') { ir('v-baja'); return bajaEscaneada(leido); }
  await cargarRepuestos();
  if (articulo(leido.valor)) { ir('v-baja'); return bajaEscaneada(leido); }
  pitido(false);
  estado('#i-estado', 'mal', 'Código no reconocido', ': ' + leido.valor);
}
/* La app Android llama a esto cuando el lector avisa por broadcast. */
window.alEscanear = texto => escaneado(texto);

document.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.key !== 'Enter' && e.keyCode !== 13) || !t.classList || !t.classList.contains('scan')) return;
  e.preventDefault();
  clearTimeout(t._pausa);
  const valor = t.value;
  t.value = '';
  escaneado(valor, t.id);
});
/* El lector configurado sin Enter escribe el código de golpe y se detiene:
   con el campo en modo lector, una pausa cierra la lectura. */
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.classList || !t.classList.contains('scan') || t.getAttribute('inputmode') !== 'none') return;
  clearTimeout(t._pausa);
  t._pausa = setTimeout(() => {
    const valor = t.value;
    if (valor.trim().length < 3) return;
    t.value = '';
    escaneado(valor, t.id);
  }, 300);
});
document.querySelectorAll('[data-teclado]').forEach(b => b.onclick = () => {
  const campo = document.getElementById(b.dataset.teclado);
  campo.setAttribute('inputmode', campo.getAttribute('inputmode') === 'none' ? 'text' : 'none');
  campo.blur(); setTimeout(() => campo.focus(), 50);
});

/* ------------------------------------------------------------------ cámara */
let CAM = null;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-camara]');
  if (b) abrirCamara(b.dataset.camara);
});
async function abrirCamara(campoId) {
  const video = $('#cam-video');
  try {
    const flujo = await navigator.mediaDevices.getUserMedia(
      {video: {facingMode: 'environment', width: {ideal: 1280}}, audio: false});
    video.srcObject = flujo;
    await video.play();
    $('#camara').hidden = false;
    let detector = null;
    if ('BarcodeDetector' in window) {
      try { detector = new BarcodeDetector(); } catch (e) {}
    }
    const lienzo = document.createElement('canvas');
    const ctx = lienzo.getContext('2d', {willReadFrequently: true});
    CAM = {flujo, activo: true};
    const vuelta = async () => {
      if (!CAM || !CAM.activo) return;
      let texto = null;
      try {
        if (detector) {
          const r = await detector.detect(video);
          if (r.length) texto = r[0].rawValue;
        } else if (window.jsQR && video.videoWidth) {
          const ancho = Math.min(800, video.videoWidth);
          const alto = Math.round(video.videoHeight * ancho / video.videoWidth);
          lienzo.width = ancho; lienzo.height = alto;
          ctx.drawImage(video, 0, 0, ancho, alto);
          const img = ctx.getImageData(0, 0, ancho, alto);
          const r = jsQR(img.data, ancho, alto, {inversionAttempts: 'dontInvert'});
          if (r) texto = r.data;
        }
      } catch (e) {}
      if (texto) { cerrarCamara(); escaneado(texto, campoId); return; }
      setTimeout(vuelta, 120);
    };
    vuelta();
  } catch (e) {
    pitido(false);
    alert('No se pudo abrir la cámara: ' + (e.message || e));
  }
}
function cerrarCamara() {
  if (CAM) { CAM.activo = false; CAM.flujo.getTracks().forEach(t => t.stop()); }
  CAM = null;
  $('#camara').hidden = true;
  enfocar();
}
$('#cam-cerrar').onclick = cerrarCamara;

/* --------------------------------------------------------------- repuestos */
let CARGADO = 0;
async function cargarRepuestos(forzar = false) {
  if (!forzar && Date.now() - CARGADO < 60000) return;
  try {
    const d = await api('/api/repuestos');
    ARTS = (d.arts || []).filter(a => a.activo !== false);
    PUEDE_GESTIONAR = !!d.puede_gestionar;
    STOCK = {};
    (d.movs || []).forEach(m => {
      const c = Number(m.cantidad) || 0;
      STOCK[m.codigo] = (STOCK[m.codigo] || 0) + (m.tipo === 'Salida' ? -c : c);
    });
    CARGADO = Date.now();
  } catch (e) {
    estado(VISTA === 'v-stock' ? '#s-estado' : '#b-estado', 'mal', 'No se pudo leer el stock', ': ' + e.message);
  }
}
async function registrar(mov) {
  const d = await api('/api/repuestos', {op: 'movimiento_crear', movimiento: mov});
  const c = Number(mov.cantidad);
  STOCK[mov.codigo] = (STOCK[mov.codigo] || 0) + (mov.tipo === 'Salida' ? -c : c);
  return d.id;
}

/* ---- baja directa */
const BAJAS = [];
try { $('#b-patente').value = localStorage.getItem('hh-patente') || ''; } catch (e) {}

$('#b-patente').addEventListener('keydown', e => {

});

async function bajaEscaneada(leido) {
  if (leido.tipo === 'unidad') {
    $('#b-patente').value = leido.valor;
    $('#b-patente').dispatchEvent(new Event('change'));
    pitido(true);
    return estado('#b-estado', 'bien', 'Patente de destino: ' + leido.valor);
  }
  const pat = patente($('#b-patente').value);
  if (!pat) {
    pitido(false);
    estado('#b-estado', 'mal', 'Falta la patente de destino', '. Cargarla o escanear el QR de la unidad.');
    return $('#b-patente').focus();
  }
  await cargarRepuestos();
  const art = articulo(leido.valor);
  if (!art) {
    pitido(false);
    return estado('#b-estado', 'mal', 'Código no encontrado', ': ' + leido.valor);
  }
  const saldo = STOCK[art.codigo] || 0;
  if ($('#b-confirmar').checked || saldo <= 0) return pedirConfirmacion(art, pat, saldo);
  darDeBaja(art, pat);
}

function pedirConfirmacion(art, pat, saldo) {
  const caja = $('#b-confirma');
  caja.hidden = false;
  caja.innerHTML = `<div class="ficha">
      <div class="cod">${esc(art.codigo)}</div>
      <div class="desc">${esc(art.descripcion)}</div>
      <div class="stock">Stock: ${saldo} · Destino: ${esc(pat)}</div>
      ${saldo <= 0 ? '<div class="estado aviso" style="margin-top:8px"><b>Sin stock registrado</b></div>' : ''}
      <button class="btn" id="b-si">Dar de baja 1</button>
      <button class="btn alt" id="b-no">Cancelar</button>
    </div>`;
  pitido(saldo > 0);
  $('#b-si').onclick = () => { caja.hidden = true; darDeBaja(art, pat); };
  $('#b-no').onclick = () => { caja.hidden = true; enfocar(); };
}

async function darDeBaja(art, pat) {
  const fila = {art, pat, hora: hora(), id: null, estado: 'enviando'};
  BAJAS.unshift(fila);
  pintarBajas();
  try {
    fila.id = await registrar({codigo: art.codigo, tipo: 'Salida', cantidad: 1, fecha: hoy(),
                               patente: pat, obs: 'Baja por escaneo (handheld)'});
    fila.estado = 'ok';
    pitido(true);
    estado('#b-estado', 'bien', 'Baja registrada: ' + art.codigo,
           ` · ${art.descripcion} · queda ${STOCK[art.codigo]}`);
  } catch (e) {
    fila.estado = 'error';
    pitido(false);
    estado('#b-estado', 'mal', 'No se registró ' + art.codigo, ': ' + e.message);
  }
  pintarBajas();
  enfocar();
}

function pintarBajas() {
  const ok = BAJAS.filter(b => b.estado === 'ok').length;
  $('#b-cuenta').textContent = ok ? `(${ok})` : '';
  $('#b-lista').innerHTML = BAJAS.map((b, i) => `
    <li class="${b.estado === 'anulada' ? 'anulado' : ''}">
      <div class="txt"><b>${esc(b.art.codigo)}</b>
        <span>${esc(b.art.descripcion)} · ${esc(b.pat)} · ${b.hora}
        ${b.estado === 'enviando' ? ' · enviando' : b.estado === 'error' ? ' · no registrada' : ''}</span></div>
      ${b.estado === 'ok' && PUEDE_GESTIONAR ? `<button data-anular="${i}">Anular</button>` : ''}
    </li>`).join('');
}
$('#b-lista').addEventListener('click', async e => {
  const b = e.target.closest('[data-anular]');
  if (!b) return;
  const fila = BAJAS[+b.dataset.anular];
  if (!confirm(`Anular la baja de ${fila.art.codigo}?`)) return;
  try {
    await api('/api/repuestos', {op: 'movimiento_borrar', id: fila.id});
    fila.estado = 'anulada';
    STOCK[fila.art.codigo] = (STOCK[fila.art.codigo] || 0) + 1;
    estado('#b-estado', 'bien', 'Baja anulada: ' + fila.art.codigo);
  } catch (err) {
    estado('#b-estado', 'mal', 'No se pudo anular', ': ' + err.message);
  }

  enfocar();
});

async function montarEscaneada(leido) {
  const codigo = String(leido.valor).trim().toUpperCase();
  try {
    const lista = await api('/api/gomeria/stock?buscar=' + encodeURIComponent(codigo));

      <li><div class="txt"><b>${esc(c.codigo)}</b><span>${esc([c.marca, c.medida, c.estado].filter(Boolean).join(' · '))}</span></div>

    <div class="kpi"><span>Km actual</span><b>${num(u.km_actual)}</b></div>
    <div class="kpi"><span>Km últimos 30 días</span><b>${num(rec.km)}</b></div>
    <div class="kpi"><span>Litros ${mes.mes ? mesNombre(mes.mes) : 'del mes'}</span><b>${num(mes.litros)}</b></div>
    <div class="kpi"><span>L/100 km ${mes.mes ? mesNombre(mes.mes) : ''}</span><b>${num(mes.litros_100km, 1)}</b></div>
    <div class="kpi"><span>Órdenes abiertas</span><b>${abiertas.length}</b></div>
    <div class="kpi"><span>Gasto de taller</span><b>$ ${num(f.ordenes && f.ordenes.total)}</b></div>
  </div>`;

  if (docs.length) h += `<h2>Documentos</h2><table class="t"><tbody>` + docs.map(d => `<tr>
      <td>${esc(d.tipo)}${d.persona ? ' · ' + esc(d.persona) : ''}</td>
      <td class="n">${fecha(d.vence)}</td>
      <td class="n"><span class="chip ${d.estado === 'vencido' ? 'mal' : 'aviso'}">${esc(d.estado)}</span></td></tr>`).join('') + `</tbody></table>`;

  h += `<h2>Combustible y recorrido</h2>`;
  h += comb.length ? `<table class="t"><thead><tr><th>Mes</th><th class="n">Litros</th><th class="n">Km</th><th class="n">L/100</th></tr></thead><tbody>` +
    comb.map(c => `<tr><td>${mesNombre(c.mes)}</td><td class="n">${num(c.litros)}</td><td class="n">${num(c.km)}</td>
      <td class="n">${c.litros_100km != null ? num(c.litros_100km, 1) : '<span title="' + esc(c.sin_consumo || '') + '">—</span>'}</td></tr>`).join('') +
    `</tbody></table>` : `<div class="estado">Sin cargas de combustible en los últimos meses.</div>`;

  h += `<h2>Órdenes de trabajo</h2>`;
  h += ords.length ? `<table class="t"><tbody>` + ords.slice(0, 12).map(o => `<tr>
      <td><b>${esc(o.numero || '')}</b> · ${fecha(o.fecha)}<br>
        <span style="color:var(--ink-muted,#666)">${esc(o.tipo === 'externa' ? (o.taller || 'Servicio externo') : 'Interna')} · ${esc(o.mantenimiento || '')}</span><br>
        ${esc(o.solicitado || o.diagnostico || o.observaciones || '')}</td>
      <td class="n"><span class="chip ${o.estado === 'abierta' ? 'aviso' : o.estado === 'anulada' ? 'mal' : 'bien'}">${esc(o.estado)}</span><br>$ ${num(o.total)}</td></tr>`).join('') +
    `</tbody></table>` : `<div class="estado">Sin órdenes registradas.</div>`;

  const cub = f.cubiertas || [];
  h += `<h2>Cubiertas puestas (${cub.length})</h2>`;
  h += cub.length ? `<table class="t"><tbody>` + cub.map(c => `<tr>
      <td><b>${esc(c.posicion)}</b></td><td>${esc(c.cubierta)} · ${esc(c.marca || '')}</td>
      <td class="n">${c.remanente_mm != null ? num(c.remanente_mm, 1) + ' mm' : ''}</td></tr>`).join('') +
    `</tbody></table>` : `<div class="estado">Sin cubiertas cargadas.</div>`;

  const gom = f.gomeria || [];
  if (gom.length) h += `<h2>Últimos movimientos de gomería</h2><table class="t"><tbody>` + gom.map(m => `<tr>
      <td>${fecha(m.fecha)}</td><td>${esc(m.tipo)} · ${esc(m.cubierta || '')}
      ${m.desde || m.hasta ? '<br><span style="color:var(--ink-muted,#666)">' + esc([m.desde, m.hasta].filter(Boolean).join(' → ')) + '</span>' : ''}</td></tr>`).join('') +
    `</tbody></table>`;

  $('#u-ficha').innerHTML = h;
}

$('#u-ficha').addEventListener('click', e => {
  const b = e.target.closest('[data-acc]');
  if (!b || !FICHA) return;
  const pat = FICHA.unidad.patente;
  if (b.dataset.acc === 'cubiertas') { ir('v-gomeria'); cargarUnidad(pat); }
  if (b.dataset.acc === 'trabajo') { ir('v-trabajo'); trabajoEscaneado({tipo: 'unidad', valor: pat}); }
});

/* ------------------------------------------------------- registrar trabajo */
let PARTE = null, T_PATENTE = '';
function trabajoEscaneado(leido) {
  if (leido.tipo === 'repuesto') { pitido(false); return estado('#t-salida', 'mal', 'No es una unidad', ': ' + leido.valor); }
  if (leido.tipo === 'trabajo') return pitido(true);
  T_PATENTE = leido.tipo === 'unidad' ? leido.valor : patente(leido.valor);
  $('#t-scan').placeholder = T_PATENTE || 'Opcional si figura en el texto';
  $('#t-scan').value = '';
  pitido(true);
  estado('#t-salida', 'bien', 'Unidad: ' + T_PATENTE);
  $('#t-texto').focus();
}

async function interpretarParte() {
  const boton = $('#t-interpretar');
  const texto = $('#t-texto').value.trim();
  if (!texto) { pitido(false); return estado('#t-salida', 'mal', 'Falta describir el trabajo realizado'); }
  boton.disabled = true;
  boton.textContent = 'Interpretando…';
  try {
    const d = await api('/api/interpretar', {patente: T_PATENTE, texto: texto});
    PARTE = d.parte_id;
    const p = d.propuesta || {};
    if (!(p.acciones || []).length) {
      pitido(false);
      return estado('#t-salida', 'aviso', p.pregunta || 'No se pudo interpretar el movimiento');
    }
    pitido(true);
    const u = d.unidad || {};
    $('#t-salida').innerHTML = `<div class="propuesta"><b>${esc(u.patente || '')} · ${esc(p.resumen || 'Movimiento interpretado')}</b><ul>` +
      p.acciones.map(a => `<li>${esc(a.tipo)} · ${esc(a.posicion || '')}` +
        (a.posicion_destino ? ' → ' + esc(a.posicion_destino) : '') +
        (a.cubierta ? ' · ' + esc(a.cubierta) : '') + '</li>').join('') +
      `</ul><button class="btn" id="t-confirmar">Confirmar</button>
      <button class="btn alt" id="t-descartar">Descartar</button></div>`;
    $('#t-confirmar').onclick = confirmarParte;
    $('#t-descartar').onclick = descartarParte;
  } catch (e) {
    pitido(false);
    estado('#t-salida', 'mal', 'No se interpretó', ': ' + e.message);
  } finally {
    boton.disabled = false;
    boton.textContent = 'Interpretar';
  }
}
$('#t-interpretar').onclick = interpretarParte;

async function confirmarParte() {
  const boton = $('#t-confirmar');
  boton.disabled = true;
  try {
    const d = await api('/api/confirmar', {parte_id: PARTE});
    pitido(true);
    $('#t-salida').innerHTML = '<div class="estado bien"><b>Movimiento guardado</b>' +
      (d.hecho || []).map(esc).join('<br>') + '</div>';
    $('#t-texto').value = '';
    PARTE = null;
  } catch (e) {
    pitido(false);
    boton.disabled = false;
    estado('#t-salida', 'mal', 'No se guardó', ': ' + e.message);
  }
}
async function descartarParte() {
  try { await api('/api/descartar', {parte_id: PARTE}); } catch (e) {}
  PARTE = null;
  $('#t-salida').innerHTML = '';
}

/* El dictado: en la APK lo hace el reconocedor de Android (TitanApp.dictar),
   en el navegador el reconocimiento de voz de Chrome. Sin ninguno de los
   dos, el botón no aparece. */
let RECONOCEDOR = null;
const VOZ_WEB = window.SpeechRecognition || window.webkitSpeechRecognition;
const VOZ_APP = window.TitanApp && typeof TitanApp.dictar === 'function';
if (VOZ_APP || VOZ_WEB) $('#t-dictar').hidden = false;

function dictado(texto) {
  const caja = $('#t-texto');
  caja.value = (caja.value.trim() ? caja.value.trim() + ' ' : '') + texto;
  $('#t-dictar').classList.remove('grabando');
  $('#t-dictar').textContent = '🎤 Dictar';
  interpretarParte();
}
window.alDictar = dictado;
window.alDictarError = msg => {
  $('#t-dictar').classList.remove('grabando');
  $('#t-dictar').textContent = '🎤 Dictar';
  pitido(false);
  estado('#t-salida', 'mal', 'Dictado', ': ' + msg);
};
$('#t-dictar').onclick = () => {
  const b = $('#t-dictar');
  if (b.classList.contains('grabando')) {
    if (RECONOCEDOR) RECONOCEDOR.stop();
    return;
  }
  b.classList.add('grabando');
  b.textContent = '● Escuchando';
  if (VOZ_APP) return TitanApp.dictar();
  RECONOCEDOR = new VOZ_WEB();
  RECONOCEDOR.lang = 'es-AR';
  RECONOCEDOR.interimResults = false;
  RECONOCEDOR.onresult = e => dictado(Array.from(e.results).map(r => r[0].transcript).join(' '));
  RECONOCEDOR.onerror = e => window.alDictarError(e.error || 'sin audio');
  RECONOCEDOR.onend = () => { b.classList.remove('grabando'); b.textContent = '🎤 Dictar'; };
  RECONOCEDOR.start();
};

/* ------------------------------------------------------------------ inicio */
/* Dentro de la APK, la dirección del servidor se cambia desde acá. */
if (window.TitanApp) {
  $('#servidor').hidden = false;
  $('#servidor').onclick = () => TitanApp.cambiarServidor();
}
fetch('/api/yo').then(r => r.ok ? r.json() : null).then(d => {
  if (!d) return;
  YO = d;
  $('#quien').textContent = d.nombre || d.usuario || '';
}).catch(() => {});
const DESDE_QR = location.pathname.match(/^\/handheld\/u\/([^/]+)/);
if (DESDE_QR) {
  ir('v-unidad', false);
  cargarFicha(patente(decodeURIComponent(DESDE_QR[1])));
} else {
  ir(location.hash.slice(1) && document.getElementById(location.hash.slice(1)) ? location.hash.slice(1) : 'v-inicio', false);
}
window.__hhListo = true;
</script>
